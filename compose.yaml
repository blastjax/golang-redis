# The whole stack: docker compose up -d --build --wait
#   web UI    http://localhost:8081 (WEB_PORT)
#   REST API  http://localhost:8080 (API_PORT)
# DB_USER, DB_NAME, DB_PORT, REDIS_PORT, API_PORT, WEB_PORT and GITHUB_TOKEN are read
# from .env, so the app and compose agree.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-github_users}
      POSTGRES_HOST_AUTH_METHOD: trust # no password, matching the empty DB_PASSWORD default; local use only
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${DB_USER:-postgres}", "-d", "${DB_NAME:-github_users}"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  api:
    build: .
    # Create or update the schema, then serve
    command: ["sh", "-c", "golang-redis setup-db && exec golang-redis serve"]
    environment:
      # Inside the compose network, the stores are reached by service name and container port
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_NAME: ${DB_NAME:-github_users}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      API_HOST: 0.0.0.0
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      retries: 30

  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
